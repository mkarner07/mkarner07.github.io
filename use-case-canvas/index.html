<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Use-Case Canvas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-header-inner">
        <h1>Use-Case Canvas</h1>
        <p class="subtitle">Describe your AI use case step by step.</p>
      </div>
    </header>

    <main class="container">
      <div class="toolbar">
        <div class="toolbar-actions">
          <div class="btn-group" role="group" aria-labelledby="export-label">
            <span class="btn-group-label" id="export-label">Export</span>
            <button type="button" class="btn" data-action="export-pdf">PDF</button>
            <button type="button" class="btn" data-action="export-md">Markdown (.md)</button>
          </div>
          <div class="btn-group" role="group" aria-labelledby="backup-label">
            <span class="btn-group-label" id="backup-label">Backup</span>
            <button type="button" class="btn" data-action="save-backup">Save (.json)</button>
            <button type="button" class="btn" data-action="load-backup">Load</button>
            <input type="file" id="backup-file" accept=".json,application/json" hidden>
          </div>
          <div class="btn-group">
            <button type="button" class="btn btn-ghost" data-action="reset">New canvas</button>
          </div>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>

      <section class="meta" aria-label="Use case details">
        <div class="meta-field meta-title">
          <label for="field-title">Use case title</label>
          <input id="field-title" type="text" data-meta="title" placeholder="e.g. Automated pre-check of incoming invoices">
        </div>
        <div class="meta-field">
          <label for="field-name">Name</label>
          <input id="field-name" type="text" data-meta="name" autocomplete="name">
        </div>
        <div class="meta-field">
          <label for="field-date">Date</label>
          <input id="field-date" type="date" data-meta="date">
        </div>
      </section>

      <div id="canvas" class="canvas"></div>
    </main>

    <footer class="app-footer">
      <p>
        Your data stays in this browser only. Use <strong>Backup → Save</strong> to keep a copy
        or to continue on another device.
      </p>
      <p class="built-with">Built with AI (Claude Code) · plain HTML, CSS and JavaScript</p>
    </footer>
  </div>

  <!-- Filled from the current canvas right before printing; only visible on paper / in the PDF. -->
  <div id="print-view" class="print-view"></div>

  <script src="app.js"></script>
</body>
</html>
